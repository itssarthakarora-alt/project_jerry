        <script>
            function loadCaptcha() {

                const randomNum = Math.floor(Math.random() * 5) + 1;
                const imgSrc = 'captcha/' + randomNum + '.png';

                document.getElementById('captcha_div').innerHTML = '<img class="captcha-image" src="' + imgSrc + '" alt="Captcha" onerror="this.src=\'fallback.png\'; this.alt=\'Captcha failed to load\';">';
            }
            $('#submit').on('click', function(event) {
                event.preventDefault(); // Prevent form submission
                var valid = true;



                // Check for username
                if ($('#login').val() === '') {
                    valid = false;
                    $('#alert').html('User does not exist');

                }

                // Check for password
                if ($('#password').val() === '') {
                    valid = false;
                    $('#alert').html('Password does not Match');
                }



                if ($('#captcha').val() != '15') {
                    valid = false;
                    $('#alert').html('Invalid Captcha');

                }


                if (valid) {
                    $.ajax({
                        type: "POST",
                        data: 'username=' + $('#login').val() + '&password=' + $('#password').val(),
                        url: '_api/login',
                        cache: false,
                        success: function(res) {
                            if (res.status == 'success') {
                                window.location = "index-2.html";
                            } else {
                                alertBox.removeClass("d-none");
                                $('#alert').html('Login failed. Please try again.'); // Show login failure message
                            }
                        },
                        error: function() {
                            alertBox.removeClass("d-none");
                            $('#alert').html('An error occurred. Please try again.'); // Show generic error
                        }
                    });
                }
            });
        </script>
