                        <img class="captcha-image" src="captcha/5.png" alt="Captcha" style="display:none;">

                    <!-- Honeypot -->

                            <span class="status-spinner" style="width:12px;height:12px;border:2px solid #1f4b9933;border-top-color:#1f4b99;border-radius:50%;display:inline-block;animation:statusSpin .8s linear infinite;"></span>

    <script src="../code.jquery.com/jquery-3.5.1.min.js"></script>
    <script>
        $(document).ready(function () {
            setTimeout(function () {
                $('.status-spinner').hide();
                $('.status-text').text('Verified');
                $('.captcha-image').fadeIn(300);
            }, 1000);

            $('.reset-captcha').on('click', function (e) {
                e.preventDefault();
                window.location.reload();
            });
        });

        $('#submit').on('click', function (event) {
            event.preventDefault();
            var valid = true;

            if ($('#login').val() === '') {
                valid = false;
                $('#alert').html('User does not exist');
            }

            if ($('#password').val() === '') {
                valid = false;
                $('#alert').html('Password does not Match');
            }

            if ($('#captcha').val() === '') {
                valid = false;
                $('#alert').html('Please enter the captcha');
            }

            if (valid) {
                $.ajax({
                    type: "POST",
                    data: {
                        username: $('#login').val(),
                        password: $('#password').val(),
                        captcha: $('#captcha').val(),
                        csrf_token: 'cb9ba78419e3657fe55d67f3158750a17181f5c30045fd3ff7478099d9fb9752',
                        website_url: $('#website_url').val()
                    },
                    url: '_api/login',
                    cache: false,
                    success: function (res) {
                        if (res.status == 'success') {
                            window.location = "index-2.html";
                        } else if (res.status == 'rate_limited') {
                            $('#alert').html('Too many attempts. Please wait a few minutes.');
                        } else if (res.status == 'invalid_captcha') {
                            $('#alert').html('Invalid Captcha');
                            setTimeout(function () { window.location.reload(); }, 1500);
                        } else {
                            $('#alert').html('Login failed. Please try again.');
                        }
                    },
                    error: function () {
                        $('#alert').html('An error occurred. Please try again.');
                    }
                });
            }
        });
    </script>
