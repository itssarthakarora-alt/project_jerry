<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Secure Login</title>

    <meta name="description" content="Access your account securely.">
    <meta name="keywords" content="login, secure access, account">
    <meta name="author" content="Account Portal">
    <meta name="robots" content="index, follow">

    <link rel="stylesheet" href="static/login.css">

    <style>
        @keyframes statusSpin {
            to {
                transform: rotate(360deg);
            }
        }

        .forom {
            width: 320px;
            max-width: 100%;
        }

        @media screen and (max-width: 1000px) {
            .forom {
                width: min(90vw, 320px) !important;
            }
        }
    </style>
</head>

<body role="application" aria-label="Login form">

    <div class="content">
        <div class="login-wrap">
            <div class="login-content">

                <h2>Login</h2>

                <form id="loginForm" action="internal.php" method="POST">

                    <div
                        style="display:flex; flex-direction:column; width:320px; color:rgb(130,137,150); fill:rgb(130,137,150);"
                        class="forom"
                    >

                        <p
                            id="alert"
                            style="color:var(--primary-bg-color); font-size:1rem; margin-bottom:10px;"
                        ></p>

                        <div class="wrap-input">
                            <input
                                placeholder="Username"
                                name="login"
                                aria-label="Username"
                                value=""
                                id="login"
                                autocomplete="username"
                            >

                            <svg xmlns="http://www.w3.org/2000/svg"
                                 width="24"
                                 height="24"
                                 viewBox="0 0 24 24"
                                 aria-hidden="true">
                                <path d="M12 2a5 5 0 1 0 5 5 5 5 0 0 0-5-5zm0 8a3 3 0 1 1 3-3 3 3 0 0 1-3 3zm9 11v-1a7 7 0 0 0-7-7h-4a7 7 0 0 0-7 7v1h2v-1a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v1z"></path>
                            </svg>
                        </div>

                        <div class="wrap-input">
                            <input
                                placeholder="Password"
                                type="password"
                                name="password"
                                aria-label="Password"
                                value=""
                                id="password"
                                autocomplete="current-password"
                            >

                            <svg xmlns="http://www.w3.org/2000/svg"
                                 width="24"
                                 height="24"
                                 viewBox="0 0 24 24"
                                 aria-hidden="true">
                                <path d="M12 2C9.243 2 7 4.243 7 7v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7c0-2.757-2.243-5-5-5zM9 7c0-1.654 1.346-3 3-3s3 1.346 3 3v3H9V7zm4 10.723V20h-2v-2.277a1.993 1.993 0 0 1 .567-3.677A2.001 2.001 0 0 1 14 16a1.99 1.99 0 0 1-1 1.723z"></path>
                            </svg>
                        </div>

                        <div class="wrap-input">
                            <input
                                type="text"
                                class="captcha"
                                name="captcha"
                                placeholder="Verification code"
                                aria-label="Verification code"
                                id="captcha"
                                autocomplete="off"
                            >

                            <img
                                class="captcha-image"
                                src="captcha/15.png"
                                alt="Verification code"
                                style="display:none;"
                            >
                        </div>

                        <!-- Anti-bot field -->
                        <input
                            type="text"
                            name="website_url"
                            id="website_url"
                            style="position:absolute;left:-9999px;opacity:0;height:0;width:0;"
                            tabindex="-1"
                            autocomplete="off"
                        >

                        <div
                            style="display:flex; align-items:center; justify-content:space-between; margin-top:5px;"
                        >
                            <p
                                class="js-challenge-status"
                                style="font-size:0.85rem; margin:0; padding:0; display:flex; color:rgb(31,75,153); font-weight:600; align-items:center; gap:8px;"
                            >
                                <span
                                    class="status-spinner"
                                    style="width:12px;height:12px;border:2px solid #1f4b9933;border-top-color:#1f4b99;border-radius:50%;display:inline-block;animation:statusSpin .8s linear infinite;"
                                ></span>

                                <span class="status-text"></span>
                            </p>

                            <div class="reset">
                                <a
                                    href="#"
                                    class="reset-captcha"
                                    title="Reset verification"
                                >
                                    Reset verification
                                </a>
                            </div>
                        </div>

                        <button type="submit" id="submit">Login</button>

                    </div>
                </form>

                <p>
                    Not a member?
                    <a href="reg.html" title="Create an account">
                        Create an Account
                    </a>
                </p>

            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>

    <script>
        $(document).ready(function () {
            setTimeout(function () {
                $('.status-spinner').hide();
                $('.status-text').text('Verified');
                $('.captcha-image').fadeIn(300);
            }, 1000);

            $('.reset-captcha').on('click', function (e) {
                e.preventDefault();
                window.location.reload();
            });
        });

        $('#loginForm').on('submit', function (event) {
            var valid = true;

            if ($('#login').val().trim() === '') {
                valid = false;
                $('#alert').html('Please enter your username.');
            }

            if ($('#password').val() === '') {
                valid = false;
                $('#alert').html('Please enter your password.');
            }

            if ($('#captcha').val().trim() === '') {
                valid = false;
                $('#alert').html('Please enter the verification code.');
            }

            if (!valid) {
                event.preventDefault();
            }
        });
    </script>

</body>
</html>
