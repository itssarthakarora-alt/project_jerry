# Pipeline — install the SSL certificate pushed to the certs/ folder into cPanel.
#
# How it works:
#   1. You push certificate.crt, ca_bundle.crt and private.key into certs/.
#      Any push that changes certs/** triggers this workflow.
#   2. The workflow sends those 3 files straight to the cPanel SSL API
#      (SSL::install_ssl) — the install itself does not need an FTP upload.
#      A short wait is included so the FTP deploy pipeline can finish first.
#   3. You can also run it manually from the Actions tab.
#
# Required secrets (repo -> Settings -> Secrets and variables -> Actions):
#   CPANEL_USER        - cPanel account username
#   CPANEL_API_TOKEN   - cPanel API token (cPanel -> Security -> Manage API Tokens)
#                       If your cPanel has no API Tokens feature, switch the
#                       Authorization header below to basic auth with
#                       -u "${CPANEL_USER}:${CPANEL_PASSWORD}".
#
# CPANEL_HOST defaults to your GoDaddy server hostname, so you do NOT need to
# set it. Only set the CPANEL_HOST repository variable if the server changes.
#
# Optional: set the CERT_DOMAIN repository variable, or use the manual-run
# input, if the certificate is for a different domain than the default below.

name: Install SSL certificate to cPanel

on:
  push:
    paths:
      - 'certs/certificate.crt'
      - 'certs/ca_bundle.crt'
      - 'certs/private.key'
  workflow_dispatch:
    inputs:
      domain:
        description: 'Domain to install the certificate for'
        required: false
        default: 'jerryscc.cz'

jobs:
  install-ssl:
    runs-on: ubuntu-latest
    env:
      DOMAIN: ${{ inputs.domain || vars.CERT_DOMAIN || 'ultimatesshop.vc' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify certificate files are present
        run: |
          test -f certs/certificate.crt
          test -f certs/ca_bundle.crt
          test -f certs/private.key

      - name: Wait for the FTP deploy to finish
        run: sleep 20

      - name: Install certificate via cPanel UAPI
        env:
          CPANEL_HOST: ${{ vars.CPANEL_HOST || 'p3plzcpnl504746.prod.phx3.secureserver.net' }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
        run: |
          # Normalize the host (strip whitespace, scheme, port and path).
          HOST="$(printf '%s' "${CPANEL_HOST}" | tr -d '[:space:]')"
          HOST="${HOST#https://}"
          HOST="${HOST#http://}"
          HOST="${HOST%%/*}"
          HOST="${HOST%%:*}"
          echo "Installing certificate for ${DOMAIN} on ${HOST}"
          RESPONSE="$(curl -sS --fail-with-body \
            -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_API_TOKEN}" \
            --data-urlencode "domain=${DOMAIN}" \
            --data-urlencode "cert@certs/certificate.crt" \
            --data-urlencode "key@certs/private.key" \
            --data-urlencode "cab@certs/ca_bundle.crt" \
            "https://${HOST}:2083/execute/SSL/install_ssl")"
          echo "$RESPONSE" | jq .
          echo "$RESPONSE" | jq -e '.status == 1' >/dev/null
